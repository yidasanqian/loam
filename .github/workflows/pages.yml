name: pages

on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - 'pages/**'
      - 'scripts/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

concurrency:
  group: deploy-pages
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    # Enable once the repo has CLOUDFLARE_API_TOKEN (Pages:Edit + D1:Edit) and CLOUDFLARE_ACCOUNT_ID:
    #   gh variable set CF_PAGES --body true
    if: vars.CF_PAGES == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm -r test
      - name: Build Pages output
        run: node scripts/build-pages.mjs
      - name: Bundle Pages Functions
        # No account needed: this only compiles pages/functions with esbuild.
        run: pnpm --filter @loam/worker exec wrangler pages functions build --cwd ../pages --outdir ../dist-artifacts/pages-functions
      - name: Apply D1 migrations
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          pnpm run db:apply:remote
      - name: Ensure Pages project
        # 幂等：首次运行时项目还不存在，由这里在 CI 里创建；已存在时 wrangler 报错，忽略，
        # 后续 Deploy Pages 仍然是对错的最终判据。
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          pnpm --filter @loam/worker exec wrangler pages project create loam --production-branch main || true
      - name: Deploy Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm pages:deploy
      - name: Smoke test
        env:
          LOAM_PAGES_URL: ${{ vars.LOAM_PAGES_URL }}
        run: |
          if [ -z "$LOAM_PAGES_URL" ]; then
            echo "LOAM_PAGES_URL is not set; skipping smoke test" >&2
            exit 0
          fi
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$LOAM_PAGES_URL/health" || true)
            [ "$code" = "200" ] && exit 0
            sleep 3
          done
          echo "health check failed" >&2
          exit 1