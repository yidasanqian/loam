name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write   # 创建 GitHub Release；npm 发布走 OIDC，不使用也不保存 token
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: Check tag and unpublished version
        working-directory: cli
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$VERSION" != "$TAG" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match cli/package.json version ${VERSION}"
            exit 1
          fi
          if npm view "@yidasanqian/loam@${VERSION}" version >/dev/null 2>&1; then
            echo "::error::@yidasanqian/loam@${VERSION} is already published; bump the version before tagging."
            exit 1
          fi
      - name: OIDC claims
        run: |
          token=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=npm:registry.npmjs.org" | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).value")
          node -e 'const p=JSON.parse(Buffer.from(process.argv[1].split(".")[1],"base64url").toString()); for (const k of ["aud","repository","repository_owner","job_workflow_ref","ref","environment","event_name"]) console.log(k+"="+(p[k]??"<none>"))' "$token"
      - run: pnpm typecheck
      - run: pnpm -r test
      - run: pnpm --filter @loam/worker run test:offline
      - run: pnpm --filter @yidasanqian/loam build
      # 先把双语正文落盘再发布：任一侧 changelog 缺段落就在 npm 发布之前失败。
      - name: Release notes (English on top, Chinese below)
        run: node scripts/release-notes.mjs "$GITHUB_REF_NAME" > release-notes.md
      # Trusted Publishing (OIDC): no token and no manual publish. The package is
      # configured at npmjs.com/package/@yidasanqian/loam/settings → Trusted Publisher
      # → GitHub Actions: yidasanqian/loam, workflow release.yml, environment empty.
      - name: Publish
        working-directory: cli
        run: |
          if [ "${{ github.event.repository.private }}" = "true" ]; then
            echo "private repository: publishing without provenance"
            npm publish --access public
          else
            npm publish --provenance --access public
          fi
      # 已存在则改写正文，让 workflow 重跑幂等（例如 npm 已发、release 建失败的上一轮）。
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --notes-file release-notes.md
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file release-notes.md --verify-tag --latest
          fi