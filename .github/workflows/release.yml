name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm -r test
      - run: pnpm --filter @loam/worker run test:offline
      - run: pnpm --filter @yidasanqian/loam build
      # Trusted Publishing (OIDC): no NPM_TOKEN. After the first manual publish,
      # configure npmjs.com/package/@yidasanqian/loam/settings → Trusted Publisher →
      # GitHub Actions: yidasanqian/loam, workflow release.yml, environment empty.
      - run: npm publish --provenance --access public
        working-directory: cli