name: deploy

on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

concurrency:
  group: deploy-worker
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    # Enable once the repo has CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID secrets:
    #   gh variable set CF_DEPLOY --body true
    if: vars.CF_DEPLOY == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm -r test
      - name: Verify D1 schema
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          columns=$(pnpm exec wrangler d1 execute loam --remote --json --command "SELECT name FROM pragma_table_info('facts')")
          for column in pinned importance superseded_by superseded_at; do
            if ! printf '%s' "$columns" | grep -q "\"$column\""; then
              echo "D1 is missing '$column'. Apply worker/migrations/0002-memory-shape.sql --remote before deploying." >&2
              exit 1
            fi
          done
      - name: Deploy worker
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy
      - name: Smoke test
        run: |
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 https://loam.sanqian.workers.dev/health || true)
            [ "$code" = "200" ] && exit 0
            sleep 3
          done
          echo "health check failed" >&2
          exit 1