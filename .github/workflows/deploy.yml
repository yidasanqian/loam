name: deploy

on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      # 只有这两支脚本进入部署步骤（D1 迁移与 schema 校验）；
      # 其余 scripts 改动不该重新发布生产 worker。
      - 'scripts/apply-d1-migrations.mjs'
      - 'scripts/check-d1-schema.mjs'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

concurrency:
  group: deploy-worker
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    # Enable once the repo has CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID secrets:
    #   gh variable set CF_DEPLOY --body true
    if: vars.CF_DEPLOY == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm -r test
      - name: Apply D1 migrations
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          pnpm run db:apply:remote
      - name: Verify D1 schema
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          columns=$(pnpm exec wrangler d1 execute loam --remote --json --command "SELECT name FROM pragma_table_info('facts')")
          printf '%s' "$columns" | node ../scripts/check-d1-schema.mjs
      - name: Deploy worker
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy
      - name: Smoke test
        env:
          LOAM_URL: ${{ vars.LOAM_URL }}
        run: |
          if [ -z "$LOAM_URL" ]; then
            echo "LOAM_URL is not set; skipping smoke test" >&2
            exit 0
          fi
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$LOAM_URL/health" || true)
            [ "$code" = "200" ] && exit 0
            sleep 3
          done
          echo "health check failed" >&2
          exit 1