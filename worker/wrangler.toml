name = "loam"
main = "src/index.ts"
compatibility_date = "2025-09-06"
workers_dev = true

# Replace database_id after `wrangler d1 create loam`.
[[d1_databases]]
binding = "DB"
database_name = "loam"
database_id = "4595906c-ed50-479a-90e1-631ed84885c6"

# Native Workers rate limiting (free plan): PLAN §5.
[[ratelimits]]
name = "RL_AUTH"
namespace_id = "1001"
simple = { limit = 10, period = 60 }

[[ratelimits]]
name = "RL_API"
namespace_id = "1002"
simple = { limit = 60, period = 60 }

[observability]
enabled = true